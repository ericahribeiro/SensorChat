<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banca</title>
<style>
 :root{--bg:#eef0f3;--card:#fff;--line:#dbe0e6;--ink:#1d2229;--mut:#6b7580;--ag:#4a3ea8;--ok:#2a6647}
 @media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1c2026;--line:#2d333b;
  --ink:#e6eaef;--mut:#8b95a1;--ag:#a99cf5;--ok:#7cc7a2}}
 *{box-sizing:border-box}
 body{margin:0;font:15px/1.65 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  height:100vh;display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px}
 @media(max-width:820px){body{grid-template-columns:1fr;height:auto}}
 .col{display:flex;flex-direction:column;min-height:0;gap:10px}
 h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0}
 #ata{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
 .l{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:0 4px 4px 0;padding:11px 14px}
 .l.agente{border-left-color:var(--ag)}
 .l b{font-size:.86rem}.l time{color:var(--mut);font-size:.75rem;margin-left:8px}
 .l p{margin:5px 0 0;white-space:pre-wrap}
 .l small{display:block;margin-top:6px;color:var(--mut);font-size:.76rem}
 .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 input,textarea{font:inherit;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:9px 11px}
 #nome{width:150px}
 textarea{width:100%;resize:vertical;min-height:74px}
 button{font:inherit;font-size:.88rem;cursor:pointer;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:8px 13px}
 button:hover{border-color:var(--ag);color:var(--ag)}
 button.pri{background:var(--ag);border-color:var(--ag);color:#fff}
 button.pri:hover{opacity:.88;color:#fff}
 button:disabled{opacity:.45;cursor:wait}
 #plano{background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:14px 16px;overflow-y:auto;flex:1}
 #plano h3{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
  margin:14px 0 5px}#plano h3:first-child{margin-top:0}
 #plano ul{margin:0;padding-left:17px}#plano li{margin:3px 0;font-size:.87rem}
 #plano .vazio{color:var(--mut);list-style:none;margin-left:-17px}
 #status{font-size:.82rem;color:var(--mut);min-height:1.2em}
</style>

<div class="col">
  <h2>Ata da reunião</h2>
  <div id="ata"></div>
  <div id="status"></div>
  <textarea id="txt" placeholder="Sua fala…  (Cmd+Enter envia)"></textarea>
  <div class="barra">
    <input id="nome" placeholder="Seu nome">
    <button class="pri" onclick="falar()">Enviar</button>
    <button onclick="rodada()">Chamar a banca</button>
    <button onclick="rodada('sensores')">Só sensores</button>
    <button onclick="rodada('arquiteto')">Só arquiteto</button>
  </div>
</div>

<div class="col">
  <h2>Plano</h2>
  <div id="plano"></div>
  <div class="barra">
    <button onclick="fechar()">Fechar tópico</button>
    <button onclick="publicar()">Publicar</button>
  </div>
</div>

<script>
let vistas = 0, ocupado = false, remoto = false;
const $ = id => document.getElementById(id);
$('nome').value = localStorage.getItem('nome') || '';
$('nome').onchange = e => localStorage.setItem('nome', e.target.value);
$('txt').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) falar(); };

function aviso(t){ $('status').textContent = t; }

async function puxar(){
  try{
    const r = await fetch('/estado?desde=' + vistas);
    const d = await r.json();
    for (const l of d.linhas){
      const el = document.createElement('div');
      el.className = 'l ' + l.papel;
      el.innerHTML = '<b></b><time></time><p></p>';
      el.querySelector('b').textContent = l.autor;
      el.querySelector('time').textContent = l.quando.slice(11,16);
      el.querySelector('p').textContent = l.texto;
      if (l.buscas && l.buscas.length){           // o que o agente consultou antes de falar
        const s = document.createElement('small');
        s.textContent = 'consultou: ' + l.buscas.map(b =>
          b.documentos.join(', ') + (b.pergunta ? ' — «' + b.pergunta + '»' : '')).join('; ');
        s.title = l.buscas.flatMap(b => b.arquivos || b.documentos).join('\n');   // id -> arquivo, no hover
        el.appendChild(s);
      }
      $('ata').appendChild(el);
    }
    if (d.linhas.length) $('ata').scrollTop = $('ata').scrollHeight;
    vistas = d.total;
    desenharPlano(d.plano);
    // outra aba disparou a banca: trava esta também, para não chamar em dobro
    if (!ocupado && d.ocupado !== remoto){
      remoto = d.ocupado;
      document.querySelectorAll('button').forEach(b => b.disabled = remoto);
      aviso(remoto ? 'a banca ainda está pensando… (rodada em andamento no servidor)' : '');
    }
  }catch(e){ aviso('sem conexão com o servidor'); }
}

function desenharPlano(p){
  const bloco = (t, xs) => '<h3>' + t + '</h3><ul>' +
    (xs.length ? xs.map(x => '<li></li>').join('') : '<li class=vazio>—</li>') + '</ul>';
  $('plano').innerHTML = bloco('Decisões', p.decisoes) + bloco('Em aberto', p.abertas) + bloco('Riscos', p.riscos);
  // preenche por textContent para não injetar HTML vindo do modelo
  const todos = [...p.decisoes, ...p.abertas, ...p.riscos];
  const lis = [...$('plano').querySelectorAll('li:not(.vazio)')];
  lis.forEach((li, i) => li.textContent = todos[i] ?? '');
}

async function falar(){
  const autor = $('nome').value.trim(), texto = $('txt').value.trim();
  if (!autor) return aviso('coloque seu nome primeiro');
  if (!texto) return;
  $('txt').value = '';
  await fetch('/falar', {method:'POST', headers:{'Content-Type':'application/json'},
                         body: JSON.stringify({autor, texto})});
  puxar();
}

async function botoes(on){ ocupado = !on; document.querySelectorAll('button').forEach(b => b.disabled = !on); }

async function rodada(quem){
  if (ocupado) return;
  botoes(false); aviso(quem ? 'pensando…' : 'a banca está pensando…');
  let msg = '';
  try{
    const r = await fetch('/rodada' + (quem ? '?quem=' + quem : ''), {method:'POST'});
    if (r.status === 409) msg = 'a banca já está falando — aguarde';
  }
  finally{ botoes(true); aviso(msg); puxar(); }
}

async function fechar(){
  if (ocupado) return;
  botoes(false); aviso('resumindo o que ficou decidido…');
  try{
    const r = await fetch('/fechar-topico', {method:'POST'});
    if (r.status === 409) aviso('a banca já está falando — aguarde');
    else if (!r.ok) aviso('o resumidor falhou — veja o terminal');
  } finally{ botoes(true); setTimeout(()=>aviso(''), 2500); puxar(); }
}

async function publicar(){
  const r = await fetch('/publicar', {method:'POST'});
  const d = await r.json();
  aviso('publicado em ' + d.arquivo);
}

puxar();
setInterval(puxar, 1500);
</script>
